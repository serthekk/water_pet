<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>What's new</title>
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <header>
    <h1>📜 What's new</h1>
    <p id="current" class="sub"></p>
  </header>
  <div id="update" class="update" hidden>
    <span id="update-text"></span>
    <button id="update-btn" type="button" hidden>Restart to update</button>
  </div>
  <main id="list"></main>
  <footer>
    <button id="github" type="button" class="link">All releases on GitHub</button>
    <button id="close" type="button">Close</button>
  </footer>
  <script src="notes.js"></script>
</body>
</html>
