# Builds and publishes a release when a version tag is pushed (npm run version:patch,
# then git push --follow-tags). The installed apps find it through latest.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release + upload the installers

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Tag must match package.json version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          if ("v$v" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::Tag $env:GITHUB_REF_NAME does not match package.json version $v. Use 'npm run version:patch' (it sets both), then 'git push --follow-tags'."
            exit 1
          }
          Write-Host "Releasing v$v"

      - run: npm ci

      - name: Make sure the Electron binary is there
        shell: pwsh
        run: ./.github/scripts/ensure-electron.ps1

      - name: Syntax check
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.js') { node --check $f; if ($LASTEXITCODE) { $bad++ } }
          if ($bad) { exit 1 }

      - name: Self-test (from source, before building)
        shell: pwsh
        run: ./.github/scripts/selftest.ps1

      - name: Build and publish (Setup + blockmap + latest.yml + Portable)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes (generated by GitHub) + check the uploaded files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = $tag.TrimStart('v')
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes "$notes"
          # a beta (1.2.0-beta.1) must be a GitHub pre-release: stable apps only look at "latest"
          if ($v -match '-') { gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease; Write-Host "Marked $tag as a pre-release (beta channel only)" }
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          Write-Host "Release assets: $($assets -join ', ')"
          # 1.2.0 -> latest.yml; 1.2.0-beta.1 -> beta.yml (the beta channel's feed)
          $feed = if ($v -match '-([A-Za-z]+)') { "$($Matches[1].ToLower()).yml" } else { 'latest.yml' }
          $want = @("WaterCat-Setup-$v.exe", "WaterCat-Setup-$v.exe.blockmap", $feed, "WaterCat-Portable-$v.exe")
          $missing = $want | Where-Object { $assets -notcontains $_ }
          if ($missing) { Write-Host "::error::Missing release files: $($missing -join ', ')"; exit 1 }
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($draft -eq 'true') { Write-Host '::error::The release is a draft - the updater cannot see drafts'; exit 1 }

      - name: Upload self-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-logs-${{ github.ref_name }}
          path: logs/
          if-no-files-found: ignore
