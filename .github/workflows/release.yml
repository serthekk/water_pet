# Builds and publishes a release when a version tag is pushed (npm run version:patch,
# then git push --follow-tags). The installed apps find it through latest.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release + upload the installers

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Tag must match package.json version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          if ("v$v" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::Tag $env:GITHUB_REF_NAME does not match package.json version $v. Use 'npm run version:patch' (it sets both), then 'git push --follow-tags'."
            exit 1
          }
          Write-Host "Releasing v$v"

      - run: npm ci

      - name: Make sure the Electron binary is there
        shell: pwsh
        run: ./.github/scripts/ensure-electron.ps1

      - name: Syntax check
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.js') { node --check $f; if ($LASTEXITCODE) { $bad++ } }
          if ($bad) { exit 1 }

      - name: Self-test (from source, before building)
        shell: pwsh
        run: ./.github/scripts/selftest.ps1

      # Build only. (electron-builder's own publishing creates the GitHub release from several
      # uploads in parallel and can end up with two releases for one tag, so the release is
      # created once, below, with every file at the same time.)
      - name: Build (Setup + blockmap + update feed + Portable)
        run: npm run build

      - name: Check the build output
        id: files
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          # 1.2.0 -> latest.yml; 1.2.0-beta.1 -> beta.yml (the beta channel's feed)
          $feed = if ($v -match '-([A-Za-z]+)') { "$($Matches[1].ToLower()).yml" } else { 'latest.yml' }
          $want = @("WaterCat-Setup-$v.exe", "WaterCat-Setup-$v.exe.blockmap", $feed, "WaterCat-Portable-$v.exe")
          $missing = $want | Where-Object { -not (Test-Path "release/$_") }
          if ($missing) { Write-Host "::error::The build did not produce: $($missing -join ', ')"; Get-ChildItem release -File | ForEach-Object Name; exit 1 }
          if ((Get-Content "release/$feed" -Raw) -notmatch "(?m)^version: $([regex]::Escape($v))\s*$") { Write-Host "::error::release/$feed is not for version $v"; exit 1 }
          "list=$(($want | ForEach-Object { "release/$_" }) -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Publish the GitHub release (all files + release notes, in one go)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = "${{ steps.files.outputs.list }}" -split ' '
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "::error::A release for $tag already exists. Delete it first (see RELEASING.md) or release a higher version."; exit 1 }
          # a beta (1.2.0-beta.1) is a GitHub pre-release: stable apps only look at "latest"
          $kind = if ($tag -match '-') { '--prerelease' } else { '--latest' }
          # the friendly notes from release-notes.json (the same ones the app's "What's new" shows)
          $notes = node -e "const r=(JSON.parse(require('fs').readFileSync('release-notes.json','utf8')).releases||[]).find((x)=>x.version===process.argv[1])||(JSON.parse(require('fs').readFileSync('release-notes.json','utf8')).releases||[]).find((x)=>x.version===process.argv[1].split('-')[0]);if(r)process.stdout.write('## '+(r.title||'')+'\n\n'+r.items.map((i)=>'- '+(i.icon?i.icon+' ':'')+i.text).join('\n')+'\n')" $tag.TrimStart('v')
          if (-not $notes) { Write-Host "::warning::release-notes.json has no entry for $tag - only GitHub's generated notes are used" }
          Set-Content -Path release-notes.md -Value ($notes -join "`n") -Encoding utf8
          gh release create $tag $files[0] $files[1] $files[2] $files[3] --repo $env:GITHUB_REPOSITORY --title $tag --notes-file release-notes.md --generate-notes --verify-tag $kind
          if ($LASTEXITCODE) { exit 1 }

      - name: Verify the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name' | Where-Object { $_ -eq $tag })
          if ($releases.Count -ne 1) { Write-Host "::error::Expected exactly 1 release for $tag, found $($releases.Count)"; exit 1 }
          $info = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
          if ($info.isDraft) { Write-Host '::error::The release is a draft - the updater cannot see drafts'; exit 1 }
          $names = @($info.assets | ForEach-Object name)
          $missing = "${{ steps.files.outputs.list }}" -split ' ' | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $names -notcontains $_ }
          if ($missing) { Write-Host "::error::Missing on the release: $($missing -join ', ')"; exit 1 }
          Write-Host "Published $tag with: $($names -join ', ')"

      - name: Upload self-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-logs-${{ github.ref_name }}
          path: logs/
          if-no-files-found: ignore
