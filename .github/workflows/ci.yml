# Checks on every push to main and every pull request: install + syntax check.
# The full self-test (Windows, ~5 min) runs when started by hand (Actions -> CI -> Run workflow)
# and on every release (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      selftest:
        description: Also run the full app self-test on Windows
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the syntax check doesn't need Electron itself
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Syntax check (node --check on every JS file)
        run: |
          status=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done
          exit $status
      - name: Phone sync test (sync.js, plain node)
        run: node tools/sync-test.js
      - name: No console.log in the main process
        run: |
          if grep -nE '^\s*[^/]*console\.log\(' main.js updater.js fullscreen.js sync.js; then
            echo "::error::console.log in a main-process file (use log())"; exit 1
          fi

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + build (debug + release APK)
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WaterCat-android
          path: android/app/build/outputs/apk/release/app-release.apk

  selftest:
    if: github.event_name == 'workflow_dispatch' && inputs.selftest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is there
        shell: pwsh
        run: ./.github/scripts/ensure-electron.ps1
      - name: Self-test
        shell: pwsh
        run: ./.github/scripts/selftest.ps1
      - name: Upload self-test logs + screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-logs
          path: logs/
          if-no-files-found: ignore
